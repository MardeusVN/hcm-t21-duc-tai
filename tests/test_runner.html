<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>HCM-T21 Test Runner — Modular Unit & Integration Suite</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; }
    .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1 { color: #f59e0b; margin-top: 0; }
    .summary { font-size: 1.1rem; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; }
    .summary.pass { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
    .summary.fail { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
    .log-box { background: #090d16; border-radius: 8px; padding: 16px; font-family: "Courier New", monospace; font-size: 0.9rem; max-height: 480px; overflow-y: auto; line-height: 1.6; }
    .log-pass { color: #34d399; }
    .log-fail { color: #f87171; font-weight: bold; }
    .log-info { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>HCM-T21 Test Runner</h1>
    <div id="test-summary" class="summary pass">Running test suites...</div>
    <div id="log-box" class="log-box"></div>
  </div>

  <!-- Load Source Modules -->
  <script src="../js/data/scenarios.js"></script>
  <script src="../js/data/quiz.js"></script>
  <script src="../js/data/theory.js"></script>
  <script src="../js/engine/chartMath.js"></script>
  <script src="../js/engine/gameState.js"></script>
  <script src="../js/engine/quizEngine.js"></script>

  <!-- Load Unit Test Suites -->
  <script src="unit_game_engine.test.js"></script>
  <script src="unit_chart_math.test.js"></script>
  <script src="unit_quiz_engine.test.js"></script>

  <script>
    const logBox = document.getElementById('log-box');
    const summaryBox = document.getElementById('test-summary');

    let totalPassed = 0;
    let totalFailed = 0;

    function htmlReporter(msg) {
      const line = document.createElement('div');
      if (msg.startsWith('[PASS]')) {
        line.className = 'log-pass';
      } else if (msg.startsWith('[FAIL]')) {
        line.className = 'log-fail';
      } else {
        line.className = 'log-info';
      }
      line.textContent = msg;
      logBox.appendChild(line);
    }

    if (window.HCMTests) {
      if (HCMTests.GameEngine) {
        const r1 = HCMTests.GameEngine.runTests(htmlReporter);
        totalPassed += r1.passed;
        totalFailed += r1.failed;
      }
      if (HCMTests.ChartMath) {
        const r2 = HCMTests.ChartMath.runTests(htmlReporter);
        totalPassed += r2.passed;
        totalFailed += r2.failed;
      }
      if (HCMTests.QuizEngine) {
        const r3 = HCMTests.QuizEngine.runTests(htmlReporter);
        totalPassed += r3.passed;
        totalFailed += r3.failed;
      }
    }

    const total = totalPassed + totalFailed;
    if (totalFailed === 0) {
      summaryBox.className = 'summary pass';
      summaryBox.textContent = `✓ ALL ${total} ASSERTIONS PASSED (100% SUCCESS RATE)`;
    } else {
      summaryBox.className = 'summary fail';
      summaryBox.textContent = `❌ ${totalFailed} OF ${total} TESTS FAILED`;
    }
  </script>
</body>
</html>
